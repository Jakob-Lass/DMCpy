[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[project]
name = "DMCpyZEBRA"
version = "1.0.0"
dependencies = [
  "matplotlib>=3",
  "numpy>=1.14",
  "h5py>=2.5",
  "scipy>=1.7",
  "datetime",
  "pandas",
  "future",
  "tk"
]
requires-python = ">=3.9"
authors = [
  {name = "Jakob Lass", email = "jakob.lass@psi.ch"},
  {name = "Moody Samuel Harrison", email = "samuel.moody@psi.ch"},
  {name = "Øystein Slagtern Fjellvåg ", email = "oystein.fjellvag@ife.no"}, 
  {name = "Zeno Maesen ", email = "zeno.maesen@psi.ch"}, 
]
maintainers = [
  {name = "Jakob Lass", email = "jakob.lass@psi.ch"},
  {name = "Zeno Maesen ", email = "zeno.maesen@psi.ch"}, 
]
description = "Python software packaged designed for reduction of neutron powder and single crystal diffraction data from ZEBRA at PSI."
readme = "README.md"
license-files = ["LICENSE.txt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://www.psi.ch/en/sinq/zebra/"
Documentation = "https://DMCpy.readthedocs.org"
Repository = "https://github.com/Jakob-Lass/DMCPy.git"
"Bug Tracker" = "https://github.com/Jakob-Lass/DMCPy/issues"

[project.scripts]
ZEBRASpy = "DMCpyZEBRA.CommandLineScripts.ZEBRAS:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
DMCpyZEBRA = ["*.dat"]
